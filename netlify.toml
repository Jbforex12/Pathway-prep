# Bust stale edge cache on /admin/ (old 301 loop). 302 + query lands on a fresh cache key.
[[redirects]]
  from = "/admin/"
  to = "/admin/?open=1"
  status = 302
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin/?open=1"
  status = 302
  force = true

# Prevent Netlify Edge from caching stale proxied admin responses (old 301 loops).
[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/api/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/api/bot/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"
